<!DOCTYPE html>

        <ellipse cx="70" cy="55" rx="42" ry="38" fill="url(#fg1)" transform="rotate(-20 70 55)"/>

        <ellipse cx="82" cy="78" rx="28" ry="24" fill="url(#fg1)" opacity="0.7"/>

      <svg class="deco flower flower-bl" viewBox="0 0 120 120" aria-hidden="true">

      <svg class="deco leaves leaves-r" viewBox="0 0 80 280" aria-hidden="true">
        <g fill="none" stroke="#8fa89a" stroke-width="1.2" stroke-linecap="round">
          <path d="M40 8 C42 90, 38 170, 44 272" opacity="0.7"/>

          <ellipse cx="50" cy="248" rx="10" ry="4.5" transform="rotate(35 50 248)"/>

      <!-- Butterflies -->

          <path d="M 46 54 C 25 55, 10 70, 20 85 C 30 95, 45 75, 47 60 Z" fill="#badae8" fill-opacity="0.75"/>
          <path d="M 52 45 C 80 10, 100 25, 95 50 C 90 65, 65 60, 54 52 Z" fill="#88b5ca" fill-opacity="0.85"/>
          <path d="M 54 54 C 75 55, 90 70, 80 85 C 70 95, 55 75, 53 60 Z" fill="#a4cbdc" fill-opacity="0.75"/>
          <path d="M 49 42 Q 44 30 40 25 M 51 42 Q 56 30 60 25" stroke="#1d3545" stroke-width="1.5"/>
          <ellipse cx="50" cy="52" rx="2" ry="12" fill="#1d3545"/>

        </h1>

        <p class="name" id="name">
          <span class="letter" style="--i:0">M</span><span class="letter" style="--i:1">A</span><span class="letter" style="--i:2">R</span><span class="letter" style="--i:3">I</span><span class="letter" style="--i:4">A</span><span class="letter spacer" style="--i:5">&nbsp;</span><span class="letter" style="--i:6">I</span><span class="letter" style="--i:7">S</span><span class="letter" style="--i:8">A</span><span class="letter" style="--i:9">B</span><span class="letter" style="--i:10">E</span><span class="letter" style="--i:11">L</span>

          <div class="detail detail-rsvp rsvp" id="detail-rsvp">
            <p class="rsvp-label">Confirmar asistencia</p>
            <a
              class="rsvp-btn"
              href="https://wa.me/573113664973?text=%C2%A1Hola!%20Confirmo%20con%20mucho%20gusto%20mi%20asistencia%20a%20los%20XV%20a%C3%B1os%20de%20Maria%20Isabel.%20%C2%A1Muchas%20gracias%20por%20la%20invitaci%C3%B3n!"
